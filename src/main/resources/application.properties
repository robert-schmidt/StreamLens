# StreamLens Application Configuration
spring.application.name=StreamLens
spring.main.web-application-type=none

# Database Configuration
streamlens.database.path=${user.home}/.streamlens/streamlens.db

# Local API Configuration (disabled by default)
streamlens.api.enabled=false
streamlens.api.port=9876

# Streaming Configuration
streamlens.streaming.buffer-size=10000
streamlens.streaming.poll-timeout-ms=100

# Security Configuration
streamlens.security.key-iterations=100000
streamlens.security.key-length=256

# UI Configuration
streamlens.ui.message-preview-length=100
streamlens.ui.max-displayed-messages=5000

# Logging - Never log secrets
logging.level.com.streamlens=INFO
logging.level.org.apache.kafka=WARN
logging.level.com.azure=WARN
