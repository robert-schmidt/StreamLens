<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2196F3"/>
      <stop offset="100%" style="stop-color:#1565C0"/>
    </linearGradient>
    <linearGradient id="lensGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#E3F2FD;stop-opacity:0.7"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect x="20" y="20" width="472" height="472" rx="80" ry="80" fill="url(#bgGrad)"/>

  <!-- Streaming lines (left side) -->
  <g fill="none" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round" opacity="0.6">
    <path d="M80 180 L160 180"/>
    <path d="M80 256 L180 256"/>
    <path d="M80 332 L140 332"/>
  </g>

  <!-- Magnifying glass lens -->
  <circle cx="300" cy="240" r="100" fill="url(#lensGrad)" stroke="#FFFFFF" stroke-width="12"/>

  <!-- Message/data lines inside lens -->
  <g fill="none" stroke="#1565C0" stroke-width="8" stroke-linecap="round" opacity="0.7">
    <path d="M240 210 L340 210"/>
    <path d="M240 245 L360 245"/>
    <path d="M240 280 L320 280"/>
  </g>

  <!-- Magnifying glass handle -->
  <line x1="370" y1="310" x2="430" y2="380" stroke="#FFFFFF" stroke-width="24" stroke-linecap="round"/>

  <!-- Streaming arrow/flow indicator -->
  <path d="M170 256 L220 256 L200 236 M220 256 L200 276" fill="none" stroke="#4CAF50" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
